[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sky-computer-use"
version = "1.0.0"
description = "Pure Python client for SkyComputerUse daemon (macOS Computer Use)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["macos", "computer-use", "accessibility", "automation", "mcp"]
authors = [{name = "matvij"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
sky-cua = "src.mcp_server:main"

[project.urls]
Homepage = "https://github.com/matvij/sky-computer-use"

[tool.setuptools.packages.find]
include = ["src*"]
